<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>TelEsOSM</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.11.0/ol.css">
</head>
<body>
<div id="app">
  <main>
    <section id="map"></section>
    <section id="report">
      <div id="controls">
        <select id="region">
          <option disabled selected>Selecciona región</option>
        </select>
        <select id="tag"></select>
        <button id="modeToggle" title="Cambiar modo de selección">🧩</button>
        <div id="customMode" hidden>
          <input id="customKey" placeholder="key personalizada (ej. contact:telegram)">
          <select id="customExpect">
            <option value="fixed">fijo</option>
            <option value="mobile">móvil</option>
            <option value="any" selected>no importa</option>
          </select>
        </div>
        <button id="analyze">Analizar</button>
      </div>
      <details id="config">
        <summary>⚙️ Configuración</summary>
        <div class="config-body">
          <label for="server">Motor de consulta</label>
          <select id="server">
            <option value="postpass">Postpass · Geofabrik</option>
            <option value="de">Overpass · Alemania</option>
            <option value="ru">Overpass · Rusia</option>
          </select>
          <small id="serverUrl"></small>
        </div>
      </details>
      <div id="tabs" role="tablist" aria-label="Vista de resultados">
        <button id="tabValidation" type="button" role="tab" aria-selected="true" aria-controls="validationPane">Validación</button>
        <button id="tabFormats" type="button" role="tab" aria-selected="false" aria-controls="formatsPane">Formatos</button>
      </div>
      <div id="validationPane" role="tabpanel" aria-labelledby="tabValidation">
      <div id="tester">
        <input id="testInput" placeholder="Introduce uno o varios números separados por ;">
        <div id="testResult">–</div>
      </div>
      <div id="stats"></div>
      <div id="errors">
        <table class="virtual-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Número</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      </div>
      <div id="formatsPane" role="tabpanel" aria-labelledby="tabFormats" hidden>
        <div id="formatSummary">
          <span id="formatArea">Sin analizar</span>
          <span id="formatElements">Elementos: 0</span>
          <span id="formatValues">Valores: 0</span>
          <span id="formatMulti">Multi: 0</span>
          <span id="formatCount">Formatos: 0</span>
        </div>
        <div id="formatTools">
          <span id="formatSelection">Selecciona un formato para mostrarlo en el mapa.</span>
          <button id="formatExpand" type="button" hidden>Solo ranking</button>
        </div>
        <div id="formatHead"><span>Formato</span><span>Valores</span><span>%</span></div>
        <div id="formatRows" aria-label="Ranking de formatos"><p class="format-empty">Analiza una región y una etiqueta para ver los formatos.</p></div>
      </div>
    </section>
  </main>
  <div id="overlay" class="ov" hidden>
    <div id="ovlBox">
      <button id="ovx" title="Cerrar">✕</button>
      <div class="spinner"></div>
      <div id="ovlTitle">Preparando…</div>
      <ul id="ovlLog"></ul>
      <button id="ovlBtn">Cerrar</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/ol@10.11.0/dist/ol.js"></script>
<script src="https://unpkg.com/libphonenumber-js@1.13.15/bundle/libphonenumber-max.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
